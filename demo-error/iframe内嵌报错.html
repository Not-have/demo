<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div>iframe内嵌报错</div>
  <!--
    允许 iframe 执行脚本，但不授予 allow-same-origin。
    浏览器会把该 iframe 视为不透明来源，访问 localStorage 时将抛出
    "Access is denied for this document"。
  -->
  <iframe
    src="./iframe内嵌的页面.html"
    sandbox="allow-scripts"
  ></iframe>
</body>
</html>
